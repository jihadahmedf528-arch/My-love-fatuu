<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Gift For You</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff3df;color:#6e3c3b;font-family:Georgia,serif;min-height:100vh;overflow-x:hidden}.screen{min-height:100vh;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px 18px;position:relative}.screen.active{display:flex}.gift{font-size:100px;cursor:pointer;filter:drop-shadow(0 12px 12px #b77a7a55);animation:bob 2s infinite}.hint{font-style:italic;margin-top:12px}.flowers{position:fixed;inset:0;pointer-events:none;overflow:hidden}.flower{position:absolute;top:-100px;font-size:34px;animation:fall 7s linear infinite}.script{font-style:italic;font-size:clamp(30px,7vw,58px);color:#9c4e57}.small{font-size:16px;color:#966b62}.btn{border:0;border-radius:28px;background:#bd6670;color:white;padding:13px 25px;font-size:16px;margin:12px;cursor:pointer;box-shadow:0 6px 18px #b86a6a44}.pinbox{display:grid;grid-template-columns:repeat(3,58px);gap:12px;margin:20px}.pinbox button{border:0;border-radius:50%;height:58px;background:#fff9ef;color:#88575a;font-size:22px;box-shadow:0 3px 12px #a8787844}.dots{letter-spacing:12px;font-size:28px;min-height:40px}.collage{width:min(900px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px auto}.collage img{width:100%;height:180px;object-fit:cover;padding:6px;background:#fff;box-shadow:0 5px 16px #76534a33;transform:rotate(var(--r))}.letter{max-width:650px;background:#fffaf0;padding:30px 25px;box-shadow:0 12px 35px #91675a22;line-height:1.9;white-space:pre-wrap;text-align:left;color:#76504a}.end{font-size:clamp(34px,8vw,64px)}@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}@media(max-width:600px){.collage{grid-template-columns:repeat(2,1fr)}.collage img{height:135px}}</style></head><body>
<div id="flowers" class="flowers"></div>
<section id="intro" class="screen active"><div class="gift" onclick="begin()">🎁</div><h1 id="introText">For you, my lovely</h1><div class="hint">Tap the gift to open</div></section>
<section id="cover" class="screen"><div class="script" id="coverTitle">From me to you</div><p id="coverSubtitle" class="small"></p><p id="names"></p><button class="btn" onclick="nextAfterCover()">Open your surprise ♥</button></section>
<section id="pin" class="screen"><h2 id="pinTitle">A little secret</h2><p id="pinHint"></p><div class="dots" id="dots">○ ○ ○ ○</div><div class="pinbox" id="keypad"></div><p id="pinError" class="small"></p></section>
<section id="gallery" class="screen"><h1 id="galleryTitle" class="script"></h1><div id="collage" class="collage"></div><button class="btn" onclick="go('letter')">Read my letter ♥</button></section>
<section id="letter" class="screen"><h1 id="letterTitle" class="script"></h1><div id="letterText" class="letter"></div><button class="btn" onclick="go('ending')">One last thing…</button></section>
<section id="ending" class="screen"><div class="script end" id="endingText"></div><p id="endingSubtitle" class="small"></p><div id="endingPhotos" class="collage"></div></section>
<audio id="music" loop></audio><script>
let gift={},pinValue="";
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));let s=document.getElementById(id);if(s)s.classList.add("active");}
function enabled(k){return gift.enabledSections?.[k]!==false}
function nextEnabled(list){return list.find(enabled)||"ending"}
function begin(){if(gift.musicUrl){let a=document.getElementById("music");a.src=gift.musicUrl;a.play().catch(()=>{})}if(enabled("flowers")){for(let i=0;i<45;i++){let f=document.createElement("div");f.className="flower";f.textContent=["🌸","🌹","🌺","💮"][i%4];f.style.left=Math.random()*100+"%";f.style.animationDelay=Math.random()*6+"s";f.style.fontSize=(20+Math.random()*25)+"px";document.getElementById("flowers").append(f)}}setTimeout(()=>{let first=nextEnabled(["cover","gallery","letter","ending"]);if(first==="cover")go("cover");else if(gift.showPin)go("pin");else go(first)},enabled("flowers")?1800:200)}
function nextAfterCover(){go(gift.showPin?"pin":nextEnabled(["gallery","letter","ending"]))}
function setupPin(){let k=document.getElementById("keypad");for(let n=1;n<=9;n++)k.innerHTML+=`<button onclick="addPin('${n}')">${n}</button>`;k.innerHTML+=`<button onclick="clearPin()">⌫</button><button onclick="addPin('0')">0</button><button onclick="checkPin()">✓</button>`}
function addPin(n){if(pinValue.length<12)pinValue+=n;document.getElementById("dots").textContent="● ".repeat(pinValue.length)+"○ ".repeat(Math.max(0,4-pinValue.length));}
function clearPin(){pinValue="";document.getElementById("dots").textContent="○ ○ ○ ○"}
async function checkPin(){let r=await fetch("/api/gift/"+encodeURIComponent(location.pathname.split("/").pop())+"/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:pinValue})});let d=await r.json();if(!r.ok){document.getElementById("pinError").textContent=d.error||"Try again";clearPin();return}go(nextEnabled(["gallery","letter","ending"]))}
function text(id,value){document.getElementById(id).textContent=value||""}
function render(){document.title=gift.title||"A Gift For You";document.body.style.background=gift.background||"#fff3df";text("introText",gift.introText);text("coverTitle",gift.coverTitle);text("coverSubtitle",gift.coverSubtitle);text("names",(gift.fromName?"From "+gift.fromName:"")+(gift.toName?"  ·  To "+gift.toName:""));text("pinHint",gift.pinHint);text("galleryTitle",gift.galleryTitle);text("letterTitle",gift.letterTitle);text("letterText",gift.letterText);text("endingText",gift.endingText);text("endingSubtitle",gift.endingSubtitle);
["intro","cover","gallery","letter","ending"].forEach(id=>{if(!enabled(id==="cover"?"cover":id))document.getElementById(id).style.display="none"});
let photos=gift.photos||[];document.getElementById("collage").innerHTML=photos.map((p,i)=>`<img src="${p}" alt="Memory" style="--r:${i%2?2:-2}deg">`).join("");document.getElementById("endingPhotos").innerHTML=photos.slice(0,6).map(p=>`<img src="${p}" alt="Memory">`).join("");
if(!gift.showPin)document.getElementById("pin").style.display="none";
if(!enabled("intro"))go(nextEnabled(["cover","gallery","letter","ending"]));
}
(async()=>{let slug=location.pathname.split("/").pop();try{let r=await fetch("/api/gift/"+encodeURIComponent(slug));gift=await r.json();if(!r.ok)throw Error(gift.error||"Gift not found");render();setupPin()}catch(e){document.body.innerHTML="<main style='padding:30px;text-align:center'>"+e.message+"</main>"}})();
</script></body></html>
